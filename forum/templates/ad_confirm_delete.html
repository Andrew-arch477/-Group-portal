<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видалити оголошення</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">Home Page</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'forums' %}">Forum</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'calendar_event' %}">Calendar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'portfolio' %}">Portfolio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'ad_list' %}">Advertisements</a>
                    </li>
                </ul>
                <div class="d-flex">
                    {% if user.is_authenticated %}
                        <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Вийти з аккаунту</button>
                      </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-outline-primary ms-2">Log in</a>
                        <a href="{% url 'register' %}" class="btn btn-outline-success ms-2">Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card delete-card">
                    <div class="card-header bg-danger text-white">
                        <h4>Видалити оголошення</h4>
                    </div>
                    <div class="card-body">
                        <p>Ви впевнені, що хочете видалити "{{ object.title }}"?</p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/ads/{{ object.id }}/" class="btn btn-secondary me-md-2">Скасувати</a>
                                <button type="submit" class="btn btn-danger">Підтвердити видалення</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
